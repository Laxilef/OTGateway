name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "assets/**"
      - "**/*.md"
      - "LICENSE"

  pull_request:
    paths-ignore:
      - "assets/**"
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep Python within the versions supported by pioarduino.
  PYTHON_VERSION: "3.13"

jobs:
  prepare:
    name: Prepare (get envs)
    # A push already builds updates to PRs from this repository.
    if: >-
      github.event.action != 'synchronize' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.envs.outputs.envs }}
      env_titles: ${{ steps.envs.outputs.env_titles }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pip install --upgrade intelhex

      - name: Get environments
        id: envs
        shell: bash
        run: |
          pio project config --json-output \
            | jq -r '
                [
                  .[]
                  | select(type == "array")
                  | select(.[0] | startswith("env:"))
                  | {
                      name: (.[0] | sub("^env:"; "")),
                      title: ([.[1][] | select(.[0] == "custom_title") | .[1]][0])
                    }
                ] as $envs
                | {
                    envs: ($envs | map(.name)),
                    env_titles: ($envs | map({key: .name, value: .title}) | from_entries)
                  }
                | to_entries[]
                | "\(.key)=\(.value | tojson)"
              ' | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.prepare.outputs.envs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pip install --upgrade intelhex

      - name: Full clean
        run: |
          pio run -e ${{ matrix.env }} -t fullclean

      - name: Build firmware & filesystem
        env:
          PIOENV: ${{ matrix.env }}
        run: |
          pio run -e ${{ matrix.env }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.env }}
          if-no-files-found: error
          path: |
            build/*.bin
            build/*.elf

  release:
    name: Release Unstable
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
    if: ${{ github.repository_owner == 'Laxilef' && github.ref == 'refs/heads/dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move unstable tag
        run: |
          git fetch --tags
          git tag -f unstable
          git push origin refs/tags/unstable --force

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Web Flasher manifest
        env:
          ENVS: ${{ needs.prepare.outputs.envs }}
          ENV_TITLES: ${{ needs.prepare.outputs.env_titles }}
        run: python3 tools/generate_webflasher.py --envs "$ENVS" --titles "$ENV_TITLES"

      - name: Delete old release assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: unstable
          fail-if-no-assets: false
          fail-if-no-release: false
          assets: |
            *.bin
            *.elf
            webflasher.json

      - name: Clear release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit unstable --notes ""

      - name: Publish Unstable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: unstable
          target_commitish: ${{ github.sha }}
          name: Unstable
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            artifacts/*.bin
            artifacts/*.elf
            artifacts/webflasher.json
