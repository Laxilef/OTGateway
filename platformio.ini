[platformio]
;extra_configs           = secrets.ini
extra_configs          = secrets.default.ini
;core_dir                = .pio

[env]
custom_version          = 2.0.0-dev
framework               = arduino
lib_deps                = ESP32Async/AsyncTCP@^3.5.0
                          ESP32Async/ESPAsyncWebServer@^3.12.1
                          mathieucarbou/MycilaWebSerial@^8.2.3
                          bblanchon/ArduinoJson@^7.4.3
                          ;ihormelnyk/OpenTherm Library@^1.1.5
                          https://github.com/Laxilef/ESP32OT
                          https://github.com/mathieucarbou/MycilaMQTT
                          https://github.com/mathieucarbou/MycilaHADiscovery/
                          gyverlibs/FileData@^1.0.3
                          gyverlibs/GyverPID@^3.3.2
                          gyverlibs/GyverBlinker@^1.1.1
                          ;pstolarz/OneWireNg@^0.14.1
                          https://github.com/pstolarz/OneWireNg.git
                          milesburton/DallasTemperature@^4.0.6
                          https://github.com/Laxilef/esp32DHT#idf5
lib_ignore              = OneWire
build_type              = ${secrets.build_type}
build_flags             = ;-mtext-section-literals
                          ;-D DEBUG_ESP_CORE -D DEBUG_ESP_WIFI -D DEBUG_ESP_HTTP_SERVER -D DEBUG_ESP_PORT=Serial
                          -D BUILD_VERSION='"${this.custom_version}"'
                          -D BUILD_ENV='"$PIOENV"'
                          -D DEFAULT_SERIAL_ENABLED=${secrets.serial_enabled}
                          -D DEFAULT_SERIAL_BAUD=${secrets.serial_baud}
                          -D DEFAULT_WEBSERIAL_ENABLED=${secrets.webserial_enabled}
                          -D DEFAULT_LOG_LEVEL=${secrets.log_level}
                          -D DEFAULT_HOSTNAME='"${secrets.hostname}"'
                          -D DEFAULT_AP_SSID='"${secrets.ap_ssid}"'
                          -D DEFAULT_AP_PASSWORD='"${secrets.ap_password}"'
                          -D DEFAULT_STA_SSID='"${secrets.sta_ssid}"'
                          -D DEFAULT_STA_PASSWORD='"${secrets.sta_password}"'
                          -D DEFAULT_PORTAL_LOGIN='"${secrets.portal_login}"'
                          -D DEFAULT_PORTAL_PASSWORD='"${secrets.portal_password}"'
                          -D DEFAULT_MQTT_ENABLED=${secrets.mqtt_enabled}
                          -D DEFAULT_MQTT_SERVER='"${secrets.mqtt_server}"'
                          -D DEFAULT_MQTT_PORT=${secrets.mqtt_port}
                          -D DEFAULT_MQTT_USER='"${secrets.mqtt_user}"'
                          -D DEFAULT_MQTT_PASSWORD='"${secrets.mqtt_password}"'
                          -D DEFAULT_MQTT_PREFIX='"${secrets.mqtt_prefix}"'
upload_speed            = 921600
monitor_speed           = 115200
;monitor_filters        = direct
monitor_filters         = esp32_exception_decoder
board_build.flash_mode  = dio
board_build.filesystem  = littlefs
check_tool              = ;pvs-studio
check_flags             = ;pvs-studio: --analysis-mode=4 --exclude-path=./.pio/libdeps

; Defaults
[esp32_defaults]
;platform                = https://github.com/pioarduino/platform-espressif32.git#prep_IDF6
platform                = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
platform_packages       = ${env.platform_packages}
board_build.partitions  = esp32_partitions.csv
lib_deps                = ${env.lib_deps}
                          https://github.com/mathieucarbou/MycilaTaskManager#main
nimble_lib              = https://github.com/h2zero/NimBLE-Arduino#master
lib_ignore              = ${env.lib_ignore}
                          BluetoothSerial
                          SimpleBLE
                          ESP RainMaker
                          RainMaker
                          ESP Insights
                          Insights
                          Zigbee
                          Matter
                          OpenThread
                          dsp
; No release includes the stop/reconnect wakeup fix yet (2026-11-21).
; With the broker unavailable, stop() can wait for reconnect backoff to expire, delaying OTA/restart.
; Fix: https://github.com/espressif/esp-mqtt/commit/c29cdda15f2812207a5740e7ec8f6efdd59d8e77
custom_component_add    = espressif/mqtt@1.1.0
custom_component_remove = espressif/esp_hosted
                          espressif/esp_wifi_remote
                          espressif/esp-dsp
                          espressif/esp_modem
                          espressif/esp_rainmaker
                          espressif/rmaker_common
                          espressif/esp_insights
                          espressif/esp_diag_data_store
                          espressif/esp_diagnostics
                          espressif/libsodium
                          espressif/esp-modbus
                          espressif/esp-cbor
                          espressif/esp-sr
                          espressif/esp32-camera
                          espressif/qrcode
                          espressif/esp-zboss-lib
                          espressif/esp-zigbee-lib
                          chmorgan/esp-libhelix-mp3
                          espressif/cjson
extra_scripts           = pre:tools/after_build_sdk.py
                          pre:tools/add_build_commit.py
                          post:tools/esp32.py
                          post:tools/build.py
build_type              = ${env.build_type}
build_unflags           = -fno-lto
build_flags             = ${env.build_flags}
                          -Os
                          -Wno-deprecated-declarations
                          -D WSL_CUSTOM_PAGE
                          ; Log transport runs on the System worker instead of producer stacks.
                          -D CONFIG_ASYNC_TCP_STACK_SIZE=5120
                          -D ARDUINOJSON_USE_DOUBLE=0
                          -D ARDUINOJSON_USE_LONG_LONG=0
                          -D DHT_TASK_STACK_SIZE=4096
                          -D MYCILA_TASK_MANAGER_NO_STATS
                          -D MYCILA_MQTT_DEBUG
                          -D MYNEWT_VAL_BLE_MAX_CONNECTIONS=1
                          -D MYNEWT_VAL_BLE_STORE_MAX_BONDS=1
                          ; BLE callbacks format logs; System sends them to transports.
                          -D MYNEWT_VAL_NIMBLE_HOST_TASK_STACK_SIZE=4608
                          -D MYNEWT_VAL_BLE_ROLE_CENTRAL=0
                          -D CORE_DEBUG_LEVEL=ESP_LOG_ERROR
                          -D USE_ESP_IDF_LOG
                          -Wl,--wrap=esp_panic_handler
                          -Wl,--wrap=esp_log_format
custom_app_flags        = -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
custom_sdkconfig        = '# CONFIG_AUTOSTART_ARDUINO is not set'
                          ; Async scalar publications must drain faster than the default 1 s MQTT poll.
                          CONFIG_MQTT_USE_CUSTOM_CONFIG=y
                          CONFIG_MQTT_PROTOCOL_311=y
                          CONFIG_MQTT_POLL_READ_TIMEOUT_MS=5
                          ; Initialization now runs on the IDF main task instead of loopTask.
                          CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192
                          '# CONFIG_LOG_VERSION_1 is not set'
                          CONFIG_LOG_VERSION_2=y
                          CONFIG_LOG_VERSION=2
                          CONFIG_LOG_COLORS=y
                          '# CONFIG_LOG_TIMESTAMP_SOURCE_RTOS is not set'
                          CONFIG_LOG_TIMESTAMP_SOURCE_SYSTEM=y
                          '# CONFIG_OPENTHREAD_ENABLED is not set'
                          '# CONFIG_ZB_ENABLED is not set'
                          '# CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT is not set'
                          '# CONFIG_LWIP_IPV6 is not set'
                          '# CONFIG_LWIP_IPV6_AUTOCONFIG is not set'
                          '# CONFIG_LWIP_PPP_SUPPORT is not set'
                          '# CONFIG_MQTT_TRANSPORT_WEBSOCKET is not set'
                          '# CONFIG_LWIP_IP_FORWARD is not set'
                          '# CONFIG_ESP_WIFI_FTM_ENABLE is not set'
                          '# CONFIG_ESP_WIFI_CSI_ENABLED is not set'
check_tool              = ${env.check_tool}
check_flags             = ${env.check_flags}


; Boards
[env:s2_mini]
extends                 = esp32_defaults
board                   = lolin_s2_mini
extra_scripts           = ${esp32_defaults.extra_scripts}
                          pre:tools/tinyusb_s2.py
custom_sdkconfig        = ${esp32_defaults.custom_sdkconfig}
                          '# CONFIG_BT_ENABLED is not set'
                          CONFIG_TINYUSB_ENABLED=y
                          CONFIG_TINYUSB_CDC_ENABLED=y
                          CONFIG_TINYUSB_CDC_MAX_PORTS=2
build_flags             = ${esp32_defaults.build_flags}
                          -D DEFAULT_OT_IN_GPIO=33
                          -D DEFAULT_OT_OUT_GPIO=35
                          -D DEFAULT_SENSOR_OUTDOOR_GPIO=9
                          -D DEFAULT_SENSOR_INDOOR_GPIO=7
                          -D DEFAULT_STATUS_LED_GPIO=11
                          -D DEFAULT_OT_RX_LED_GPIO=12

[env:s3_mini]
extends                 = esp32_defaults
board                   = lolin_s3_mini
custom_sdkconfig        = ${esp32_defaults.custom_sdkconfig}
                          '# CONFIG_TINYUSB_ENABLED is not set'
lib_deps                = ${esp32_defaults.lib_deps}
                          ${esp32_defaults.nimble_lib}
build_flags             = ${esp32_defaults.build_flags}
                          -D ARDUINO_USB_MODE=1
                          -D ARDUINO_USB_CDC_ON_BOOT=1
                          -D MYNEWT_VAL_BLE_EXT_ADV=1
                          -D USE_BLE=1
                          -D DEFAULT_OT_IN_GPIO=35
                          -D DEFAULT_OT_OUT_GPIO=36
                          -D DEFAULT_SENSOR_OUTDOOR_GPIO=13
                          -D DEFAULT_SENSOR_INDOOR_GPIO=12
                          -D DEFAULT_STATUS_LED_GPIO=11
                          -D DEFAULT_OT_RX_LED_GPIO=10

;[env:s3_mini_no_psram]  ; FOR TESTS
;extends                 = env:s3_mini
;build_unflags           = ${esp32_defaults.build_unflags}
;                          -DBOARD_HAS_PSRAM
;                          -mdisable-hardware-atomics
;custom_sdkconfig        = ${env:s3_mini.custom_sdkconfig}
;                          '# CONFIG_SPIRAM is not set'

[env:c3_mini]
extends                 = esp32_defaults
board                   = lolin_c3_mini
lib_deps                = ${esp32_defaults.lib_deps}
                          ${esp32_defaults.nimble_lib}
build_unflags           = ${esp32_defaults.build_unflags}
                          -mno-save-restore
custom_link_flags       = -msave-restore
build_flags             = ${esp32_defaults.build_flags}
                          -msave-restore
                          -D MYNEWT_VAL_BLE_EXT_ADV=1
                          -D USE_BLE=1
                          -D DEFAULT_OT_IN_GPIO=8
                          -D DEFAULT_OT_OUT_GPIO=10
                          -D DEFAULT_SENSOR_OUTDOOR_GPIO=0
                          -D DEFAULT_SENSOR_INDOOR_GPIO=1
                          -D DEFAULT_STATUS_LED_GPIO=4
                          -D DEFAULT_OT_RX_LED_GPIO=5
custom_sdkconfig        = ${esp32_defaults.custom_sdkconfig}
                          CONFIG_COMPILER_SAVE_RESTORE_LIBCALLS=y

[env:nodemcu_32]
extends                 = esp32_defaults
board                   = nodemcu-32s
lib_deps                = ${esp32_defaults.lib_deps}
                          ${esp32_defaults.nimble_lib}
build_flags             = ${esp32_defaults.build_flags}
                          -D USE_BLE=1
                          -D DEFAULT_OT_IN_GPIO=16
                          -D DEFAULT_OT_OUT_GPIO=4
                          -D DEFAULT_SENSOR_OUTDOOR_GPIO=15
                          -D DEFAULT_SENSOR_INDOOR_GPIO=26
                          -D DEFAULT_STATUS_LED_GPIO=2
                          -D DEFAULT_OT_RX_LED_GPIO=19

[env:nodemcu_32_160mhz]
extends                 = env:nodemcu_32 
board_build.f_cpu       = 160000000L ; set frequency to 160MHz

[env:d1_mini32]
extends                 = esp32_defaults
board                   = wemos_d1_mini32
lib_deps                = ${esp32_defaults.lib_deps}
                          ${esp32_defaults.nimble_lib}
build_flags             = ${esp32_defaults.build_flags}
                          -D USE_BLE=1
                          -D DEFAULT_OT_IN_GPIO=21
                          -D DEFAULT_OT_OUT_GPIO=22
                          -D DEFAULT_SENSOR_OUTDOOR_GPIO=12
                          -D DEFAULT_SENSOR_INDOOR_GPIO=18
                          -D DEFAULT_STATUS_LED_GPIO=2
                          -D DEFAULT_OT_RX_LED_GPIO=19

[env:esp32_c6]
extends                 = esp32_defaults
board                   = esp32-c6-devkitc-1
lib_deps                = ${esp32_defaults.lib_deps}
                          ${esp32_defaults.nimble_lib}
build_unflags           = ${esp32_defaults.build_unflags}
                          -mno-save-restore
                          -fexceptions
                          -Os
custom_link_flags       = -msave-restore
                          -Oz
build_flags             = ${esp32_defaults.build_flags}
                          -msave-restore
                          -fno-exceptions
                          -Oz
                          -D _GLIBCXX20_CONSTEXPR=__attribute__((cold))constexpr
                          -D _GLIBCXX23_CONSTEXPR=__attribute__((cold))constexpr
                          -D USE_BLE=1
                          -D DEFAULT_OT_IN_GPIO=15
                          -D DEFAULT_OT_OUT_GPIO=23
                          -D DEFAULT_SENSOR_OUTDOOR_GPIO=0
                          -D DEFAULT_SENSOR_INDOOR_GPIO=0
                          -D DEFAULT_STATUS_LED_GPIO=11
                          -D DEFAULT_OT_RX_LED_GPIO=10
custom_sdkconfig        = ${esp32_defaults.custom_sdkconfig}
                          CONFIG_COMPILER_SAVE_RESTORE_LIBCALLS=y
                          '# CONFIG_LIBC_OPTIMIZED_MISALIGNED_ACCESS is not set'
                          '# CONFIG_COMPILER_CXX_EXCEPTIONS is not set'
                          '# CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT is not set'
                          '# CONFIG_MBEDTLS_TLS_SERVER_ONLY is not set'
                          CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
                          '# CONFIG_MBEDTLS_SSL_PROTO_DTLS is not set'
                          '# CONFIG_ESP_HTTPS_SERVER_ENABLE is not set'
                          ; Assertions still abort; detailed failure messages are omitted.
                          '# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE is not set'
                          '# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE is not set'
                          CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
                          ; Use the compact definitions above instead of spaced native metadata.
                          '# CONFIG_COMPILER_CXX_GLIBCXX_CONSTEXPR_COLD_CONSTEXPR is not set'
                          '# CONFIG_COMPILER_CXX_GLIBCXX_CONSTEXPR_COLD is not set'
                          CONFIG_COMPILER_CXX_GLIBCXX_CONSTEXPR_NO_CHANGE=y

[env:otthing]
extends                 = esp32_defaults
board                   = lolin_c3_mini
lib_deps                = ${esp32_defaults.lib_deps}
                          ${esp32_defaults.nimble_lib}
build_unflags           = ${esp32_defaults.build_unflags}
                          -mno-save-restore
custom_link_flags       = -msave-restore
build_flags             = ${esp32_defaults.build_flags}
                          -msave-restore
                          -D MYNEWT_VAL_BLE_EXT_ADV=1
                          -D USE_BLE=1
                          -D DEFAULT_OT_IN_GPIO=3
                          -D DEFAULT_OT_OUT_GPIO=1
                          ;-D DEFAULT_SENSOR_OUTDOOR_GPIO=0
                          ;-D DEFAULT_SENSOR_INDOOR_GPIO=1
                          -D DEFAULT_STATUS_LED_GPIO=8
                          -D DEFAULT_OT_RX_LED_GPIO=2
                          -D OT_BYPASS_RELAY_GPIO=20
custom_sdkconfig        = ${esp32_defaults.custom_sdkconfig}
                          CONFIG_COMPILER_SAVE_RESTORE_LIBCALLS=y
